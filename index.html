<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary Meta -->
    <meta name="title" content="abiface — ABI interface for any smart contract" />
    <meta name="description" content="Turn any smart contract into a usable interface. Paste an ABI and contract address to call read functions, send write transactions, and enter payable values in ETH." />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abiface.baboya.eth.limo" />
    <meta property="og:title" content="abiface — ABI interface for any smart contract" />
    <meta property="og:description" content="Turn any smart contract into a usable interface. Paste an ABI and contract address to call read functions, send write transactions, and enter payable values in ETH." />
    <meta property="og:image" content="https://abiface.baboya.eth.limo/assets/img/abiface.webp" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://abiface.baboya.eth.limo" />
    <meta name="twitter:title" content="abiface — ABI interface for any smart contract" />
    <meta name="twitter:description" content="Turn any smart contract into a usable interface. Paste an ABI and contract address to call read functions, send write transactions, and enter payable values in ETH." />
    <meta name="twitter:image" content="https://abiface.baboya.eth.limo/assets/img/abiface.webp" />
    <title>abiface</title>
    <script>
      (() => {
        const mode = localStorage.themeMode;
        const system = matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          mode === "light" || mode === "dark"
            ? mode
            : system
              ? "dark"
              : "light";
        Object.assign(document.documentElement.dataset, {
          theme,
          themeSource:
            mode === "light" || mode === "dark" ? mode : "system",
          selectedTheme: mode === "light" || mode === "dark" ? mode : "",
        });
      })();
    </script>
    </script>
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/img/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="./assets/css/styleKit.css" />
    <style>
    :root {
      --color-bg: #8fb8f0;
      --color-txt: #12263f;
    }
    [data-theme="dark"] {
      --color-bg: #1f3a5a;
      --color-txt: #eef4fb;
    }
      html {
        block-size: 100dvh;
        inline-size: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      body {
        background: var(--color-bg);
        color: var(--color-txt);
        font-family: "Helvetica Neue", system-ui, sans-serif;
        transition: background 0.3s, color 0.3s;
        padding: 20px;
        padding-top: 80px;
      }
      @media (max-width: 600px) {
        body { padding-bottom: 90px; }
      }
      .btn {
        color: var(--color-txt);
        border: none;
        background-color: var(--dk-connect-color-btn);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        transition: background-color 0.3s;
        &:hover {
          background-color: var(--dk-connect-color-hvr);
        }
        &:disabled {
          opacity: 0.55;
          cursor: progress;
        }
      }

      /* ABI interface */
      input::placeholder,
      textarea::placeholder {
        color: color-mix(in srgb, var(--dk-color-txt) 45%, transparent);
        opacity: 1;
      }
      [hidden] {
        display: none !important;
      }
      .abi-app {
        max-width: 1100px;
        margin: 30px auto 60px;
        display: grid;
        gap: 20px;
      }
      .abi-intro h1 {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.02em;
      }
      .abi-intro p {
        margin-top: 6px;
        opacity: 0.75;
      }
      .abi-panel {
        display: grid;
        gap: 16px;
        padding: 24px;
        color: var(--color-txt);
        background-color: var(--dk-surface);
        border: var(--dk-border-medium) solid var(--dk-menu-border);
        border-radius: 20px;
      }
      .abi-field {
        display: grid;
        gap: 6px;
      }
      .abi-field label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        font-size: var(--dk-font-14);
        font-weight: var(--dk-weight-semibold);
      }
      .abi-hint {
        font-size: 12px;
        font-weight: 400;
        opacity: 0.6;
      }
      .abi-field input,
      .abi-field textarea,
      .fn-input,
      .abi-toolbar input {
        width: 100%;
        padding: 10px 12px;
        color: inherit;
        font: inherit;
        background-color: color-mix(in srgb, var(--dk-color-bg) 55%, transparent);
        border: 1px solid var(--dk-menu-border);
        border-radius: 8px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .abi-field textarea {
        min-height: 120px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.5;
        resize: vertical;
      }
      .abi-field input:focus,
      .abi-field textarea:focus,
      .fn-input:focus,
      .abi-toolbar input:focus {
        outline: none;
        border-color: color-mix(in srgb, var(--dk-color-txt) 40%, transparent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--dk-color-txt) 10%, transparent);
      }
      .abi-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .abi-error {
        font-size: 14px;
        color: rgb(var(--dk-color-red));
      }
      .abi-summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        font-size: 14px;
        background-color: var(--dk-surface);
        border: 1px solid var(--dk-menu-border);
        border-radius: 12px;
      }
      .abi-summary-label {
        font-weight: var(--dk-weight-semibold);
      }
      .abi-address {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        cursor: pointer;
      }
      .abi-summary-count {
        margin-left: auto;
        opacity: 0.65;
      }
      .abi-toolbar {
        display: flex;
        justify-content: flex-end;
      }
      .abi-toolbar input {
        width: min(100%, 320px);
        padding: 9px 12px;
      }
      .abi-results {
        display: grid;
        gap: 24px;
      }
      .fn-section {
        display: grid;
        gap: 12px;
      }
      .fn-heading h2 {
        font-size: 1.15rem;
      }
      .fn-description {
        margin-top: 2px;
        font-size: 13px;
        opacity: 0.65;
      }
      .fn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
      }
      .fn-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        background-color: var(--dk-surface);
        border: 1px solid var(--dk-menu-border);
        border-radius: 14px;
      }
      .fn-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .fn-name {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15px;
        font-weight: var(--dk-weight-bold);
        word-break: break-all;
      }
      .fn-badge {
        padding: 2px 8px;
        font-size: 11px;
        font-weight: var(--dk-weight-semibold);
        letter-spacing: 0.02em;
        border-radius: 999px;
      }
      .fn-badge-read {
        color: rgb(var(--dk-color-green));
        background-color: rgba(var(--dk-color-green), 0.15);
      }
      .fn-badge-write {
        color: rgb(var(--dk-color-blue));
        background-color: rgba(var(--dk-color-blue), 0.15);
      }
      .fn-badge-pay {
        color: rgb(var(--dk-color-orange));
        background-color: rgba(var(--dk-color-orange), 0.15);
      }
      .fn-signature {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        opacity: 0.7;
        word-break: break-word;
      }
      .fn-fields {
        display: grid;
        gap: 10px;
      }
      .fn-field {
        display: grid;
        gap: 5px;
      }
      .fn-label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        font-weight: var(--dk-weight-medium);
      }
      .fn-type {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        opacity: 0.55;
      }
      .fn-footer {
        margin-top: auto;
      }
      .fn-action {
        width: 100%;
      }
      .fn-result {
        max-height: 240px;
        padding: 10px 12px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        background-color: color-mix(in srgb, var(--dk-color-bg) 55%, transparent);
        border-radius: 8px;
      }
      .fn-result-error {
        color: rgb(var(--dk-color-red));
      }
      .abi-empty {
        opacity: 0.7;
      }
      @media (max-width: 600px) {
        .abi-app {
          margin-top: 10px;
        }
        .abi-panel {
          padding: 18px;
        }
        .fn-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top bar -->
    <header class="dk-bar">
      <div class="dk-brand">ABIFACE</div>

      <div class="dk-widget">
        <!-- Chain + wallet (moves to its own bottom bar on mobile) -->
        <div class="dk-group">
          <!-- Chain select -->
          <div class="dk-dropdown" data-dropdown="chain">
            <button
              id="chain-btn"
              class="dk-btn dk-chain-btn"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              title="Select network"
            >
              <img id="chain-btn-icon" src="./assets/img/eth.png" alt="" />
              <span id="chain-btn-label">Ethereum</span>
              <svg class="dk-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div id="chain-menu" class="dk-menu dk-chain-menu" role="listbox" aria-label="Networks"></div>
          </div>

          <!-- Wallet connect -->
          <div class="dk-dropdown" data-dropdown="wallet">
            <button id="connect-btn" class="dk-btn dk-connect-btn" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="dk-connect-label">Connect</span>
            </button>
            <div id="connect-menu" class="dk-menu dk-wallet-menu" role="menu" aria-label="Wallets">
              <div id="connect-wallet-list" class="dk-wallet-list"></div>
              <div id="connect-get-wallet" class="dk-get-wallet">
                <a href="https://ethereum.org/en/wallets/" target="_blank" rel="noopener noreferrer">Get a Wallet!</a>
              </div>
              <button id="copy-address-btn" class="dk-menu-item dk-copy-item" type="button" role="menuitem" hidden>Copy Address</button>
              <button id="disconnect-btn" class="dk-menu-item dk-danger-item" type="button" role="menuitem" hidden>Disconnect</button>
            </div>
          </div>
        </div>

        <!-- Settings -->
        <div class="dk-dropdown" data-dropdown="settings">
          <button id="settings-btn" class="dk-btn dk-icon-btn" type="button" aria-label="Settings" aria-haspopup="menu" aria-expanded="false" title="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div id="settings-menu" class="dk-menu dk-settings-menu" role="menu" aria-label="Settings">
            <div class="dk-theme-segment" role="radiogroup" aria-label="Theme">
              <button type="button" data-theme-mode="system" role="radio" aria-checked="false">System</button>
              <button type="button" data-theme-mode="light" role="radio" aria-checked="false">Light</button>
              <button type="button" data-theme-mode="dark" role="radio" aria-checked="false">Dark</button>
            </div>

            <!-- RPC accordion -->
            <div class="dk-settings-block">
              <button id="rpc-toggle" class="dk-accordion-btn" type="button" aria-expanded="false" aria-controls="rpc-panel">
                <span>Add RPC URL</span>
                <svg class="dk-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
              <div id="rpc-panel" class="dk-accordion-panel">
                <div class="dk-accordion-inner">
                  <div id="rpc-inputs"></div>
                  <button id="save-rpc-btn" class="dk-save-btn" type="button">Save RPC</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Notifications Container -->
    <div id="notificationContainer"></div>

    <!-- ABI interface -->
    <main class="abi-app" id="abi-app">
      <section class="abi-intro">
        <h1>ABI interface</h1>
        <p>
          Paste a contract address and its ABI. Every function becomes a call or
          send control, with payable amounts entered in ETH.
        </p>
      </section>

      <form id="abi-form" class="abi-panel" autocomplete="off">
        <div class="abi-field">
          <label for="abi-address">Contract address</label>
          <input
            id="abi-address"
            type="text"
            placeholder="0x…"
            spellcheck="false"
          />
        </div>

        <div class="abi-field">
          <label for="abi-input">
            ABI
            <span class="abi-hint">JSON array, artifact, or human-readable</span>
          </label>
          <textarea
            id="abi-input"
            rows="6"
            placeholder='[{"type":"function","name":"balanceOf","inputs":[{"name":"owner","type":"address"}],"outputs":[{"name":"","type":"uint256"}],"stateMutability":"view"}]'
            spellcheck="false"
          ></textarea>
        </div>

        <div class="abi-actions">
          <button class="btn" type="submit">Load contract</button>
          <button class="btn" type="button" id="abi-clear">Clear</button>
        </div>

        <p id="abi-error" class="abi-error" hidden></p>
      </form>

      <div id="abi-summary" class="abi-summary" hidden></div>

      <div id="abi-toolbar" class="abi-toolbar" hidden>
        <input
          id="abi-filter"
          type="search"
          placeholder="Filter functions…"
          aria-label="Filter functions"
        />
      </div>

      <div id="abi-results" class="abi-results"></div>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
